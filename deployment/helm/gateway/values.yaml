replicaCount: 1

image:
  repository: docker.io/library/gateway-service
  tag: "1.0.0"
  pullPolicy: Never

service:
  type: ClusterIP
  port: 8082
  metricsPort: 8081

env:
  - name: HTTP_PORT
    value: "8082"
  # Адрес currency внутри кластера. Формат: <имя-сервиса>.<неймспейс>:порт
  - name: CURRENCY_GRPC_ADDR
    value: "currency:8090" 
  # Настройки Redis
  - name: REDIS_ADDR
    value: "redis-master.cache.svc.cluster.local:6379"
  - name: REDIS_PASSWORD
    value: "RedisPassword"