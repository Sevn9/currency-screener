auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9095

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

storage_config:
  boltdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/cache
  filesystem:
    directory: /loki/chunks 

#limits_config для совместимости с новыми версиями Loki
limits_config:
  allow_structured_metadata: false 
    
schema_config:
  configs:
    - from: 2020-10-24
      # Используем boltdb-shipper и старую схему v11
      store: boltdb-shipper 
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h