server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  # Отправляем логи на сервис loki по порту 3100
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
- job_name: containers
  # Чтение логов из Docker
  docker_sd_configs:
    - host: unix:///var/run/docker.sock
      refresh_interval: 5s
  relabel_configs:
    # Извлекаем имя контейнера
    - source_labels: ['__meta_docker_container_name']
      regex: '/(.*)'
      target_label: 'container'
    # Извлекаем имя сервиса из docker-compose (для фильтрации в Grafana)
    - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
      target_label: 'service'
    # Исключаем Loki и Promtail от сбора своих собственных логов
    - source_labels: ['__meta_docker_container_name']
      regex: '(/loki|/promtail)'
      action: drop