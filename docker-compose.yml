version: '3.8'


services:
  postgres:
      image: postgres:17
      environment:
        POSTGRES_HOST: postgres
        POSTGRES_DB: currency_db
        POSTGRES_USER: currency1
        POSTGRES_PASSWORD: secret123
        PGDATA: /data/postgres
      ports:
        - "5432:5432"
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U currency1 -d currency_db"]
        interval: 1s
        timeout: 1s
        retries: 5

  migrate:
      image: migrate/migrate
      command: >
        -path /migrations
        -database postgres://currency1:secret123@postgres:5432/currency_db?sslmode=disable 
        up
      volumes:
        - ./currency/internal/migrations:/migrations
      depends_on:
        postgres:
          condition: service_healthy
  

  auth-generator:
    image: artyomyatsenko/final-task-auth-generator:latest
    ports:
      - "8082:8080"
    environment:
      AUTH_TOKEN_LIFETIME: 2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ping"]
      interval: 1s
      timeout: 1s
      retries: 5
  cron:
    build:
      context: .
      dockerfile: ./deployment/local/Dockerfile
      args:
        - BUILD_TARGET=./currency/cmd/cron/main.go
    volumes:
      - ./deployment/local:/deployment/local  # Mount the local directory into the container
    depends_on:
      postgres:
        condition: service_healthy
    command: ["--config=/deployment/local/currency-local-config.yaml"]

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass RedisPassword
    container_name: currency_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  currency:
    build:
      context: .
      dockerfile: ./deployment/local/Dockerfile
      args:
        - BUILD_TARGET=./currency/cmd/currency/main.go
    volumes:
      - ./deployment/local:/deployment/local
    ports:
      - "8081:8081" #metrics
      - "8090:8090" #grpc
      - "8099:8099" #healthcheck
    depends_on:
      postgres:
        condition: service_healthy
    command: ["--config=/deployment/local/currency-local-config.yaml"]

  gateway:
    build:
      context: .
      dockerfile: ./deployment/local/Dockerfile
      args:
        - BUILD_TARGET=./gateway/cmd/gateway/main.go
    volumes:
      - ./deployment/local:/deployment/local
    ports:
      - "8080:8082"
    depends_on:
      redis:
        condition: service_healthy
    command: ["--config=/deployment/local/gateway-local-config.yaml"]

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/config.yml
    volumes:
      # Хранение логов на хосте
      - ./monitoring/loki:/loki
      # Подключение конфигурационного файла
      - ./monitoring/loki/loki-config.yml:/etc/loki/config.yml

  promtail:
    image: grafana/promtail:latest
    command: -config.file=/etc/promtail/config.yml
    volumes:
      # Подключение конфигурационного файла Promtail
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro 
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    depends_on:
      - currency

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./monitoring/grafana:/var/lib/grafana
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:latest
    ports:
      - "9100:9100"
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    ports:
      - "8083:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped